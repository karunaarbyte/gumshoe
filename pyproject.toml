[project]
name = "gumshoe"
version = "0.1.0"
description = "A detective game to test jev and compare with nimble."
readme = "README.md"
authors = [
    { name = "Karuna" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gumshoe-api = "gumshoe.api.__main__:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls real backends (run with: uv run pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import order, UP modern syntax, B bugbear, SIM simplify, ASYNC async pitfalls
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests use untyped pytest fixtures and mock handlers; keep src strict, tests pragmatic.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
