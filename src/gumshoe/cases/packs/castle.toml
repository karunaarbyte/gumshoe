[method_defs.fall_from_height]
label = "pushed from a height"
aliases = ["shove", "fall", "thrown down"]
clues = [
  "A loose stone had been set back on a high ledge {place.in}, its mortar still wet.",
  "A mason said the rail {place.in} had been loose since spring.",
  "A single glove lay wedged in a crack on a stair {place.in}.",
]

[[method_defs.fall_from_height.traces]]
kind = "scuff"
