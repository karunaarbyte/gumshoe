[meta]
id = "castle"
skeleton_rev = 1
skin_rev = 2
slots = 4
presets = ["long", "short", "standard"]

[capacity]
max_suspects = 8
max_locations = 7
max_methods = 6
max_record_kinds = 3

[[slot_defs]]
key = "matins"
at = "at matins"
during = "during matins"

[[slot_defs]]
key = "noon"
at = "at noon"
during = "during the noon meal"

[[slot_defs]]
key = "vespers"
at = "at vespers"
during = "during vespers"

[[slot_defs]]
key = "compline"
at = "at compline"
during = "during compline"

[location_defs.great_hall]
names = [{ text = "Great Hall", article = "the" }]
descriptions = [
  "{^place} echoes with voices and the scrape of benches.",
  "{^place} is lit by a hearth the size of a cart.",
]

[location_defs.chapel]
names = [{ text = "Chapel of Saint Anne", article = "the" }]
descriptions = [
  "{^place} smells of old stone and incense.",
  "{^place} is hushed, with narrow windows of coloured glass.",
]

[location_defs.keep]
names = [{ text = "Keep", article = "the" }]
descriptions = [
  "{^place} is bare stone, with narrow stairs in tight turns.",
  "{^place} holds the lord's strongroom behind a heavy locked door.",
]

[location_defs.kitchen]
names = [{ text = "Kitchen", article = "the" }]
descriptions = [
  "{^place} is warm and loud with the clang of pots and ladles.",
  "{^place} smells of onions and smoke.",
]

[location_defs.undercroft]
names = [{ text = "Undercroft", article = "the" }]
descriptions = [
  "{^place} is cold, with low arches and long rows of shelves.",
  "{^place} is dark at the back, where the oldest stores are kept.",
]

[location_defs.gatehouse]
names = [{ text = "Gatehouse", article = "the" }]
descriptions = [
  "{^place} sits over the portcullis, draughty and cramped.",
  "{^place} rings with the shouts of the guards at their post.",
]

[location_defs.herb_garden]
names = [{ text = "Herb Garden", article = "the" }]
descriptions = [
  "{^place} is laid out in neat beds behind a low wall.",
  "{^place} smells of damp earth and cut grass.",
]

[record_defs.visitor_ledger]
subject = "suspect"
medium = "written"
names = [{ text = "visitor ledger", article = "the" }]
