[motive_defs.ambition]
label = "out of ambition"
aliases = ["ambition", "hunger for power"]
secrets = [
  "{^who} had tried on the lord's chain of office when alone.",
  "{^who} had quietly courted the favour of every guest of rank.",
]

[motive_defs.blackmail]
label = "to escape blackmail"
aliases = ["blackmail", "extortion"]
secrets = [
  "{^who} had been paying someone in secret to keep an old letter hidden.",
  "{^who} had received a note demanding payment to keep an old shame from the lord.",
]

[motive_defs.debt]
label = "to cover a gambling debt"
aliases = ["debt", "money owed"]
secrets = [
  "{^who} had pawned a silver ring and could not buy it back.",
  "{^who} had lost a whole season's wages at dice.",
]

[motive_defs.faith]
label = "out of faith"
aliases = ["faith", "devotion"]
secrets = [
  "{^who} wore a hair shirt in secret and fasted for days.",
  "{^who} spoke of a holy duty that outweighed all earthly law.",
]

[motive_defs.fear]
label = "out of fear"
aliases = ["fear", "dread"]
secrets = [
  "{^who} flinched at every footstep in the corridor.",
  "{^who} slept with a stool wedged against the door.",
]

[motive_defs.inheritance]
label = "to claim an inheritance"
aliases = ["inheritance", "legacy"]
secrets = [
  "{^who} was the last living kin of the old lord's brother.",
  "{^who} had kept a copy of the lord's will with one line underlined.",
]

[motive_defs.jealousy]
label = "out of jealousy"
aliases = ["jealousy", "envy"]
secrets = [
  "{^who} stared at the lord's favourites with narrowed eyes.",
  "{^who} was heard muttering that the lord's favourite had stolen a sweetheart.",
]

[motive_defs.revenge]
label = "to take revenge"
aliases = ["revenge", "vengeance"]
secrets = [
  "{^who} had never forgiven the lord for a sister sent away in disgrace.",
  "{^who} was heard swearing that someone would answer for it one day.",
]

[method_defs.candlestick]
label = "bludgeoned with a candlestick"
aliases = ["candle stand", "brass holder"]
clues = [
  "A servant had polished the brass holders {place.in} until they shone.",
  "A rag {place.in} was thick with hot wax and smelled of brass polish.",
  "A tall stand had been moved {place.in} and set beside the door.",
]

[[method_defs.candlestick.traces]]
kind = "bruise"
location_kinds = ["great_hall", "chapel", "keep", "kitchen", "undercroft", "gatehouse"]
templates = [
  "A heavy stand lay overturned {place.in}, its drip pan bent and dented.",
  "A tall stand lay toppled {place.in}, cold wax spattered round its dented foot.",
]
absent = [
  "A tall stand {place.in} stood upright on its round foot, its brass gleaming.",
  "A heavy stand {place.in} sat firm by the wall, its drip pan level.",
]

[method_defs.poison_wine]
label = "poisoned in wine"
aliases = ["poison", "draught", "tainted cup"]
clues = [
  "A small stoppered phial lay {place.in}, rinsed and set on its side.",
  "A servant said the wine casks {place.in} had been tapped a day early.",
  "A damp cloth {place.in} smelled sharp and sour.",
]

[[method_defs.poison_wine.traces]]
kind = "residue"
location_kinds = ["great_hall", "chapel", "keep", "kitchen", "undercroft", "herb_garden"]
templates = [
  "A cup lay tipped over {place.in}, with a bitter white crust inside.",
  "A jug {place.in} held a purple film and gave off a sour smell.",
]
absent = [
  "A cup {place.in} stood upright on the board, its inside pale and its rim dry.",
  "A jug {place.in} held clear water and smelled faintly of apples.",
]

[method_defs.dagger]
