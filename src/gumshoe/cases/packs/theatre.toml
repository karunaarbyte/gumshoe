[meta]
id = "theatre"
title = "Theatre"
blurb = "A death backstage stops the show at a 1920s playhouse, and someone in the building did it."
skeleton_rev = 1
skin_rev = 1
slots = 4
presets = ["long", "short", "standard"]
smalltalk_allow = [
  "applause",
  "bravo",
  "cheers",
  "cold",
  "curtain",
  "darling",
  "encore",
  "evening",
  "goodbye",
  "hello",
  "indeed",
  "matinee",
  "morning",
  "music",
  "pardon",
  "please",
  "rain",
  "show",
  "splendid",
  "tea",
  "thanks",
  "today",
  "tomorrow",
  "warm",
  "weather",
  "welcome",
  "yesterday",
]

[capacity]
max_suspects = 8
max_locations = 7
max_methods = 6
max_record_kinds = 3

[[slot_defs]]
key = "rehearsal"
at = "at the rehearsal"
during = "during the rehearsal"

[[slot_defs]]
key = "half_hour"
at = "at the half-hour call"
during = "during the half-hour call"

[[slot_defs]]
key = "interval"
at = "at the interval"
during = "during the interval"

[[slot_defs]]
key = "house_emptied"
at = "after the house emptied"
during = "as the house emptied"

[location_defs.stage]
names = [{ text = "Stage", article = "the", prep = "on" }]
descriptions = [
  "{^place} is wide and dusty, lit by a ring of hot footlights.",
  "{^place} is dressed as a drawing room of painted canvas flats.",
]

[location_defs.wings]
names = [{ text = "Wings", article = "the" }]
descriptions = [
  "{^place} are narrow and dim, crowded with flats and coiled ropes.",
  "{^place} smell of size and greasepaint, and every board creaks.",
]

[location_defs.dressing_room]
names = [{ text = "Dressing Room", article = "the" }]
descriptions = [
  "{^place} is cramped, with a long mirror ringed by bare bulbs.",
  "{^place} smells of powder and cold cream, and gowns hang on every peg.",
]

[location_defs.fly_gallery]
names = [{ text = "Fly Gallery", article = "the" }]
descriptions = [
  "{^place} runs high above the stage, lined with ropes and cleats.",
  "{^place} is hot and dark, and the scenery hangs on lines below it.",
]

[location_defs.box_office]
names = [{ text = "Box Office", article = "the", prep = "at" }]
descriptions = [
  "{^place} is a small brass grille in the lobby, stacked with ticket rolls.",
  "{^place} smells of ink and coins, with a seating plan pinned to the wall.",
]

[location_defs.orchestra_pit]
names = [{ text = "Orchestra Pit", article = "the" }]
descriptions = [
  "{^place} is sunk below the footlights, crowded with chairs and music stands.",
  "{^place} is low and close, and smells of rosin and valve oil.",
]

[location_defs.green_room]
names = [{ text = "Green Room", article = "the" }]
descriptions = [
  "{^place} is shabby and warm, with sagging chairs and a tea urn.",
  "{^place} is papered with old playbills and hums with gossip.",
]

[record_defs.call_sheet]
subject = "suspect"
medium = "written"
names = [{ text = "call sheet", article = "the" }]
location_kinds = [
  "dressing_room", "fly_gallery", "green_room", "orchestra_pit", "stage", "wings",
]
presence = [
  "{^record} listed {who} {place.in} {time.at}.",
  "According to {record}, {who} was {place.in} {time.at}.",
]

[record_defs.prompt_copy]
subject = "location"
medium = "written"
names = [{ text = "prompt copy", article = "the" }]
location_kinds = ["stage"]
presence = [
  "{^record} showed {who} {place.in} {time.at}.",
  "By {record}, {who} was {place.in} {time.at}.",
]
entries = [
  "{^record} lay open on a small desk, its pages soft with handling.",
  "{^record} was bound in black cloth and marked with pencilled cues.",
  "Several hands had written in {record}, some bold and some cramped.",
]

[record_defs.stage_door_register]
subject = "suspect"
medium = "written"
names = [{ text = "stage-door register", article = "the" }]
location_kinds = [
  "box_office", "dressing_room", "fly_gallery", "green_room", "orchestra_pit", "stage", "wings",
]
presence = [
  "{^record} named {who} {place.in} {time.at}.",
  "An entry in {record} placed {who} {place.in} {time.at}.",
]

[roles.leading_lady]
names = [
  { text = "Isadora", pronoun = "she", proper = true },
  { text = "Vivienne", pronoun = "she", proper = true },
]
noun = "leading lady"
style = "grand and theatrical; delivers every answer like a speech"
traits = ["tall and striking, with a fur stole", "with kohl-rimmed eyes and a long cigarette holder"]
record_kinds = ["call_sheet", "stage_door_register"]
motive_types = ["ambition", "fear", "inheritance", "jealousy", "revenge"]

[roles.musician]
names = [
  { text = "Felix", pronoun = "he", proper = true },
  { text = "Ada", pronoun = "she", proper = true },
]
noun = "musician"
style = "dreamy and offhand; hums a phrase before every answer"
traits = ["thin and shabby in a dinner jacket", "with rosin dust on the cuffs"]
record_kinds = ["call_sheet", "stage_door_register"]
motive_types = ["ambition", "debt", "fear", "inheritance", "theft"]

[roles.prompter]
names = [
  { text = "Mabel", pronoun = "she", proper = true },
  { text = "Horace", pronoun = "he", proper = true },
]
noun = "prompter"
style = "soft and precise; corrects any word spoken wrongly"
traits = ["small and owlish behind round spectacles", "with a pencil tucked behind one ear"]
record_kinds = ["prompt_copy", "stage_door_register"]
motive_types = ["blackmail", "fear", "inheritance", "jealousy", "revenge"]

[roles.stage_manager]
names = [
  { text = "Walter", pronoun = "he", proper = true },
  { text = "Frank", pronoun = "he", proper = true },
]
noun = "stage manager"
style = "calm and exact; speaks in cues and timings"
traits = ["square and unhurried, in shirtsleeves", "with a stopwatch on a chain"]
record_kinds = ["call_sheet", "prompt_copy", "stage_door_register"]
motive_types = ["ambition", "blackmail", "debt", "fear", "revenge"]

[roles.stagehand]
names = [
  { text = "Alfie", pronoun = "he", proper = true },
  { text = "Bert", pronoun = "he", proper = true },
]
noun = "stagehand"
style = "gruff and plain; gives short answers in a London drawl"
traits = ["broad and rope-burned across the palms", "in a flat cap and rolled sleeves"]
record_kinds = ["call_sheet", "prompt_copy", "stage_door_register"]
motive_types = ["debt", "fear", "jealousy", "revenge", "theft"]

[roles.understudy]
names = [
  { text = "Julian", pronoun = "he", proper = true },
  { text = "Kitty", pronoun = "she", proper = true },
]
noun = "understudy"
style = "eager and anxious; quotes other people's lines without meaning to"
traits = ["young and hungry-looking", "forever mouthing lines from a dog-eared script"]
record_kinds = ["call_sheet", "stage_door_register"]
motive_types = ["ambition", "debt", "inheritance", "jealousy", "theft"]

[roles.usher]
names = [
  { text = "Ivy", pronoun = "she", proper = true },
  { text = "Ernest", pronoun = "he", proper = true },
]
noun = "usher"
style = "polite and chatty; repeats what the patrons say"
traits = ["neat in a braided uniform", "with a torch and a bundle of programmes"]
record_kinds = ["stage_door_register"]
motive_types = ["ambition", "blackmail", "debt", "fear", "theft"]

[roles.wardrobe_mistress]
names = [
  { text = "Hilda", pronoun = "she", proper = true },
  { text = "Winifred", pronoun = "she", proper = true },
]
noun = "wardrobe mistress"
style = "brisk and motherly; notices every loose thread"
traits = ["stout, with a tape measure round her neck", "with a mouthful of pins and quick hands"]
record_kinds = ["call_sheet", "stage_door_register"]
motive_types = ["blackmail", "inheritance", "jealousy", "revenge", "theft"]

[motive_defs.ambition]
label = "out of ambition"
aliases = ["ambition", "hunger for fame"]
secrets = [
  "{^who} had written in secret to a rival impresario asking for a better post.",
  "{^who} had quietly courted every critic and backer in town.",
]
hints = [
  "{^who} watched the star's name on the bills with a long, quiet look.",
  "{^who} kept a set of fine clothes ready for a grander station.",
  "{^who} asked many questions about who held the purse strings of the show.",
]

[motive_defs.blackmail]
label = "to escape blackmail"
aliases = ["blackmail", "extortion"]
secrets = [
  "{^who} had been paying someone in secret to keep an old letter hidden.",
  "{^who} had received a note demanding payment to keep an old shame quiet.",
]
hints = [
  "{^who} started whenever the callboy came by with the post.",
  "{^who} burned each scrap of paper in the nearest ashtray.",
  "{^who} kept a sealed letter stitched into the lining of a coat.",
]

[motive_defs.debt]
label = "to cover a gambling debt"
aliases = ["debt", "money owed"]
secrets = [
  "{^who} had pawned a gold watch to pay a heavy loss at the races.",
  "{^who} had run up a great sum with a bookmaker who waited by the stage door.",
]
hints = [
  "{^who} counted the coins in {who.poss} purse again and again.",
  "{^who} asked for {who.poss} wages early at the end of every week.",
  "{^who} looked away whenever the racing results were read aloud.",
]

[motive_defs.fear]
label = "out of fear"
aliases = ["dread", "fear"]
secrets = [
  "{^who} flinched at every footstep in the passage.",
  "{^who} slept with a chair wedged against the door of {who.poss} lodgings.",
]
hints = [
  "{^who} left a small lamp burning in {who.poss} lodgings until daybreak.",
  "{^who} was unwilling to walk the dark passages once the house lights went out.",
  "{^who} always chose a seat with {who.poss} back against the wall.",
]

[motive_defs.inheritance]
label = "to claim an inheritance"
aliases = ["inheritance", "legacy"]
secrets = [
  "{^who} was the last living kin of a rich old theatrical family.",
  "{^who} had kept a copy of a will with one line underlined.",
]
hints = [
  "{^who} knew the names in a certain family tree by heart.",
  "{^who} asked often after a certain elderly person's health with a thoughtful frown.",
  "{^who} kept a close count of a certain elderly person's years.",
]

[motive_defs.jealousy]
label = "out of jealousy"
aliases = ["envy", "jealousy"]
secrets = [
  "{^who} stared at a certain pair of sweethearts across the stalls with narrowed eyes.",
  "{^who} was heard muttering that a rival had lured away a sweetheart.",
]
hints = [
  "{^who} fell silent whenever a certain beauty in the company was praised.",
  "{^who} stood close to a certain couple on the stairs and watched each gesture.",
  "{^who} spoke sharply of a certain young lady whenever her name came up.",
]

[motive_defs.revenge]
label = "to take revenge"
aliases = ["revenge", "vengeance"]
secrets = [
  "{^who} still nursed a grudge over an old wrong done to a brother on the boards.",
  "{^who} was heard swearing that someone would answer for it one day.",
]
hints = [
  "{^who} kept an old newspaper cutting and looked at it often.",
  "{^who} recited a list of old wrongs under {who.poss} breath.",
  "{^who} marked each slight in a small black notebook.",
]

[motive_defs.theft]
label = "to hide a jewel theft"
aliases = ["stolen jewels", "theft"]
secrets = [
  "{^who} had a diamond bracelet sewn into the hem of a winter coat.",
  "{^who} had pried the setting from a brooch that was reported missing.",
]
hints = [
  "{^who} lingered near the office safe more than any errand required.",
  "{^who} studied the necklaces of the ladies in the boxes with care.",
  "{^who} kept a jeweller's loupe hidden in a coat pocket.",
]

[method_defs.sandbag]
label = "struck with a sandbag"
aliases = ["counterweight", "sandbag"]
clues = [
  "A split sack {place.in} had spilled a trail of fine grit.",
  "A cleaner said a heavy sack had been dragged across the floor {place.in}.",
  "A scatter of sand had been swept into a corner {place.in}.",
]

[[method_defs.sandbag.traces]]
kind = "dent"
location_kinds = ["dressing_room", "fly_gallery", "green_room", "orchestra_pit", "stage", "wings"]
templates = [
  "A burst canvas sack lay dropped {place.in}, spilling sand across the boards.",
  "A deep fresh dent marked the boards {place.in}, ringed with spilt sand.",
]
absent = [
  "A full canvas sack hung safely {place.in}, stitched tight along every seam.",
  "A smooth even stretch of boards lay {place.in}, swept and freshly waxed.",
]

[method_defs.poisoned_toast]
label = "poisoned in a toast"
aliases = ["poison", "tainted champagne"]
clues = [
  "A small stoppered bottle lay {place.in}, rinsed and set on its side.",
  "A dresser said a tray of glasses had stood {place.in} before the bell.",
  "A damp handkerchief {place.in} smelled sharp and bitter.",
]

[[method_defs.poisoned_toast.traces]]
kind = "residue"
location_kinds = ["box_office", "dressing_room", "green_room", "orchestra_pit", "stage", "wings"]
templates = [
  "A coupe glass lay knocked on its side {place.in}, with a bitter crust inside.",
  "A tall wine glass stood half full {place.in}, with a grey film and a sour smell.",
]
absent = [
  "A coupe glass stood upright on a tray {place.in}, with a bright shine inside.",
  "A tall wine glass stood rinsed out {place.in}, with a clear rim and a mild smell.",
]

[method_defs.shears]
label = "stabbed with sewing shears"
aliases = ["scissors", "shears"]
clues = [
  "A whetstone {place.in} was still wet, with fresh grey streaks across its face.",
  "A dresser said a long bundle wrapped in muslin had been seen {place.in}.",
  "A snipped length of black thread lay {place.in}, cut clean at one end.",
]

[[method_defs.shears.traces]]
kind = "wound"
location_kinds = ["box_office", "dressing_room", "green_room", "orchestra_pit", "wings"]
templates = [
  "An empty leather sheath, slim and short, lay dropped {place.in}.",
  "A slim steel point had snapped off and lay glinting {place.in}.",
]
absent = [
  "A leather sheath, slim and polished, hung up neatly {place.in}.",
  "A steel point sat keen and whole within its sheath {place.in}.",
]

[method_defs.rigging_cord]
label = "strangled with rigging cord"
aliases = ["cord", "garrotte"]
clues = [
  "A length of spare line had been cut from a coil {place.in}.",
  "A tight knot of tarred twine lay {place.in}, tied by a practised hand.",
  "A fireman said a coil of line had been left {place.in} by someone in a hurry.",
]

[[method_defs.rigging_cord.traces]]
kind = "fibre"
location_kinds = ["box_office", "dressing_room", "fly_gallery", "green_room", "stage", "wings"]
templates = [
  "Coarse hemp fibres clung to a rough post {place.in}, snagged and loose.",
  "A shiny worn groove ran round a pipe {place.in}, and frayed strands lay beneath.",
]
absent = [
  "Pale fresh paint coated a tall wooden post {place.in}, smooth and whole.",
  "A smooth painted band ran round a pipe {place.in}, and swept boards lay beneath.",
]

[method_defs.prop_pistol]
label = "shot with a prop pistol"
aliases = ["pistol", "revolver"]
clues = [
  "A box of cartridges had been opened {place.in}, and two were gone.",
  "A faint smell of burnt powder lingered {place.in}.",
  "A scrap of paper wadding lay curled {place.in}.",
]

[[method_defs.prop_pistol.traces]]
kind = "burn"
location_kinds = [
  "box_office", "dressing_room", "fly_gallery", "green_room", "orchestra_pit", "stage", "wings",
]
templates = [
  "A black scorch mark ran across a wall {place.in}, with a smell of sulphur.",
  "A spent brass cartridge lay {place.in}, its end blackened.",
]
absent = [
  "A white wall stood clean and pale {place.in}, with a smell of wet varnish.",
  "A brass cartridge lay boxed {place.in}, its end gleaming.",
]

[method_defs.fall_from_height]
label = "pushed from a height"
aliases = ["fall", "shove", "thrown down"]
clues = [
  "A loose bolt had been set back in a bracket {place.in}, its thread still bright.",
  "A carpenter said the fittings {place.in} had been loose for a week.",
  "A tuft of torn cloth hung caught on a splinter {place.in}.",
]

[[method_defs.fall_from_height.traces]]
kind = "scuff"
location_kinds = ["fly_gallery", "orchestra_pit", "stage", "wings"]
templates = [
  "Pale scrapes marked a high wall {place.in}, with loose grit on the boards below.",
  "A tall ladder hung broken from its hooks {place.in}, one rung snapped clean off.",
]
absent = [
  "A high wall looked grey and even {place.in}, with the boards below swept smooth.",
  "A tall ladder hung firm upon its hooks {place.in}, its rungs straight and sound.",
]

[scene_types.murder_on_stage]
location_kinds = ["stage"]
allowed_methods = ["sandbag", "poisoned_toast", "rigging_cord", "prop_pistol", "fall_from_height"]
